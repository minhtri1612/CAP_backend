_schema-version: "3.3.0"
ID: procurement-hub
version: 1.0.0
description: Multi-Vendor Collaborative Procurement & Logistics Hub (CAP POC 2)
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

modules:
  # CAP backend
  - name: procurement-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
      instances: 1
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: procurement-hub-auth
      - name: procurement-hub-db
      - name: procurement-hub-destination
      - name: procurement-hub-connectivity
      - name: hub-frontend-api
        group: destinations
        properties:
          name: hub-frontend
          url: ~{url}
          forwardAuthToken: false

  # HANA HDI deployer
  - name: procurement-hub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: procurement-hub-db

  # React portal (static)
  - name: procurement-hub-frontend
    type: nodejs
    path: hub-frontend
    provides:
      - name: hub-frontend-api
        properties:
          url: ${default-url}
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
    parameters:
      buildpack: staticfile_buildpack
      memory: 128M
      disk-quota: 512M
    requires:
      - name: procurement-hub-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # AppRouter
  - name: procurement-hub-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      memory: 256M
      disk-quota: 256M
    properties:
      TENANT_HOST_PATTERN: "^(.*)-procurement-hub-approuter.${default-domain}"
      UAA_SERVICE_NAME: procurement-hub-auth
    requires:
      - name: procurement-hub-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: hub-frontend-api
        group: destinations
        properties:
          name: hub-frontend
          url: ~{url}
          forwardAuthToken: false
      - name: procurement-hub-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: procurement-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: procurement-hub-auth
      path: ./xs-security.json
      config:
        xsappname: procurement-hub-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
            - https://*.cfapps.ap21.hana.ondemand.com/**
    requires:
      - name: app-api

  # HDI on HANA Cloud (create hana-cloud hana-free in Cockpit first, then this binds)
  - name: procurement-hub-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: procurement-hub-db

  - name: procurement-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: procurement-hub-destination

  - name: procurement-hub-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
      service-name: procurement-hub-connectivity
